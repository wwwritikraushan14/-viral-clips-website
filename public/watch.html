<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch Exclusive Videos — VIRAL CLIPS</title><link rel="stylesheet" href="/styles.css">
<link rel="canonical" href="/" id="canonical">
<meta name="description" content="Watch your exclusive VIRAL CLIPS videos. Members-only streaming on your private one-device access link.">
<meta property="og:title" content="Watch Exclusive Videos — VIRAL CLIPS">
<meta property="og:description" content="Watch your exclusive VIRAL CLIPS videos. Members-only streaming on your private one-device access link.">
<meta property="og:type" content="website"></head>
<body><div class="wrap">
  <div class="nav"><div class="logo">VIRAL <span>CLIPS</span></div>
    <div id="expiry"></div></div>

  <div id="noAccess" style="display:none" class="center"><div class="card" style="text-align:center;max-width:480px">
    <h1>🔒 Members only</h1><p class="muted" style="margin:14px 0">Open your private access link from email to watch.</p>
    <a class="btn" href="/plans.html">Get access</a></div></div>

  <div id="expired" style="display:none" class="center"><div class="card" style="text-align:center;max-width:480px">
    <h1>⌛ Subscription ended</h1><p class="muted" style="margin:14px 0">Your plan has expired. Renew to keep watching.</p>
    <a class="btn" href="/plans.html">Renew now</a></div></div>

  <div id="app" style="display:none">
    <h2 class="section-title" style="margin-top:8px">Your videos</h2>
    <div class="player-wrap" id="playerWrap" style="display:none">
      <h3 id="nowPlaying" style="margin-bottom:10px"></h3>
      <video id="player" controls playsinline controlsList="nodownload"></video>
      <p class="muted" style="font-size:13px;margin-top:8px">🔒 Your link is locked to this device. Downloads are disabled.</p>
    </div>
    <div class="video-grid" id="videos"></div>
  </div>
</div>
<script>
const esc = s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){
  const me = await fetch('/api/me').then(r=>r.json()).catch(()=>null);
  if(!me || me.error==='no_access'){ document.getElementById('noAccess').style.display='flex'; return; }
  if(me.error==='expired'){ document.getElementById('expired').style.display='flex'; return; }
  document.getElementById('app').style.display='block';
  document.getElementById('expiry').innerHTML =
    `<span class="expiry-pill">👋 ${esc(me.name)} · <b>${me.daysLeft===null?'Lifetime access':me.daysLeft+' day'+(me.daysLeft===1?'':'s')+' left'}</b></span>`;
  const videos = await fetch('/api/videos').then(r=>r.json());
  document.getElementById('videos').innerHTML = videos.length ? videos.map(v=>`
    <div class="video-card" onclick="playVideo(${v.id},'${esc(v.title)}')">
      <div class="video-thumb">▶️</div><h4>${esc(v.title)}</h4></div>`).join('')
    : '<p class="muted">No videos yet — new drops coming soon.</p>';
}
function playVideo(id,title){
  const w = document.getElementById('playerWrap'); w.style.display='block';
  document.getElementById('nowPlaying').textContent = title;
  const p = document.getElementById('player'); p.src = '/api/stream/'+id; p.play().catch(()=>{});
  w.scrollIntoView({behavior:'smooth'});
}
init();
</script>
<script>try{document.getElementById("canonical").href=location.origin+location.pathname;}catch(e){}</script>
</body></html>
